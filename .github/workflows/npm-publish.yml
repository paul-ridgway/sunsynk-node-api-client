name: Node.js Package

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm ci
      - run: npm run compile
      # - run: npm test

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - run: npm run build
      - name: Verify registry (OIDC)
        run: |
          echo "registry=$(npm config get registry)"
          # whoami often returns 401 with OIDC tokens; publish still uses trusted publishing.
          npm whoami || echo "npm whoami skipped (not supported or not logged in for this token type)"
      - name: Publish to npm
        run: npm publish --provenance --access public
